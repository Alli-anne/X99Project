<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X99 Project</title>
    <link rel="stylesheet" href="Index.css">
  </head>
  <body class="design-page edit-page">
    <header id="main-header">
      <h1>Easy Design</h1>
    </header>
    <main class="design-workspace">
      <section id="edit-page">
        <h2 id="project-name" contenteditable="true" role="textbox" aria-label="Project name">Project Name</h2>
        <div class="color-palette" aria-label="Project color palette">
          <div class="palette-slot"><button class="palette-swatch palette-swatch--cream" type="button" data-color-role="primary" aria-label="Change primary color">DDD8C4</button><button class="palette-lock" type="button" data-lock-role="primary" aria-label="Unlock primary color" aria-pressed="true">🔒</button></div>
          <div class="palette-slot"><button class="palette-swatch palette-swatch--mint" type="button" data-color-role="secondary" aria-label="Change secondary color">A3C9A8</button><button class="palette-lock" type="button" data-lock-role="secondary" aria-label="Lock secondary color" aria-pressed="false">🔓</button></div>
          <div class="palette-slot"><button class="palette-swatch palette-swatch--sage" type="button" data-color-role="accent" aria-label="Change accent color">84B59F</button><button class="palette-lock" type="button" data-lock-role="accent" aria-label="Lock accent color" aria-pressed="false">🔓</button></div>
          <div class="palette-slot"><button class="palette-swatch palette-swatch--teal" type="button" data-color-role="background" aria-label="Change background color">69A297</button><button class="palette-lock" type="button" data-lock-role="background" aria-label="Lock background color" aria-pressed="false">🔓</button></div>
          <button class="refresh-button" id="refresh-palette" type="button" aria-label="Try a different palette">⟳</button>
          <div class="palette-count-controls" aria-label="Change number of colors"><button id="palette-add" type="button" aria-label="Add color">+</button><button id="palette-remove" type="button" aria-label="Remove color">−</button></div>
          <fieldset id="button-style-popout" class="button-style-popout" hidden>
            <legend>Button style</legend>
            <label for="button-padding">Padding <output id="button-padding-value">18px</output></label>
            <input id="button-padding" type="range" min="8" max="48" value="18">
            <label for="button-font-size">Text size <output id="button-font-size-value">32px</output></label>
            <input id="button-font-size" type="range" min="12" max="48" value="32">
            <label for="button-font-family">Font</label>
            <select id="button-font-family">
              <option value="inherit">Project font</option>
              <option value="Arial, sans-serif">Arial</option>
              <option value="Georgia, serif">Georgia</option>
              <option value="Verdana, sans-serif">Verdana</option>
            </select>
            <label for="button-text-color">Text color</label>
            <input id="button-text-color" type="color" value="#FFFFFF">
          </fieldset>
        </div>
        <p id="accessibility-warning" class="accessibility-warning" role="status" hidden></p>
        <div class="fonts-div">
          <div class="fonts">
            <h3>Header Font <button class="refresh-button" type="button" aria-label="Refresh header font">⟳</button></h3>
            <ul id="header-font">
              <li>Open Sauce</li>
              <li>Open Sauce</li>
              <li>Open Sauce</li>
              <li>Open Sauce</li>
              <li>Open Sauce</li>
            </ul>
          </div>
          <div class="fonts">
            <h3>Body Font <button class="refresh-button" type="button" aria-label="Refresh body font">⟳</button></h3>
            <ul id="body-font">
              <li>Arvo</li>
              <li>Arvo</li>
              <li>Arvo</li>
              <li>Arvo</li>
              <li>Arvo</li>
            </ul>
          </div>
        </div>
        <div class="button-div">
          <button class="btn" type="button">BUTTON</button>
          <button class="btn" type="button">BUTTON</button>
        </div>
        <div class="img-div">
          <div id="editing-selected-images"></div>
        </div>
      </section>
      <details id="edit-tools" open>
        <summary class="tools-toggle" aria-label="Toggle editing tools" title="Show or hide editing tools"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5 4 4M4 20l4-1L20 7a2.1 2.1 0 0 0-3-3L5 16z" /></svg></summary>
        <div class="tools-list" role="group" aria-label="Editing tools">
          <button class="tools" id="draw" type="button" aria-label="Style colors" data-help="Select this tool, then click text, a button, or another element to change its background and text colors.">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6 4 4M10 14 20 4a2.1 2.1 0 0 0-3-3L7 11zM10 14c0 4-3 6-7 6 2-2 0-5 4-6" /></svg>
          </button>
          <button class="tools" id="shapes" type="button" aria-label="Add elements" data-help="Add shapes, text, and buttons to your design. Select an added element to customize it.">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="12" height="12" rx="2" /><path d="M17 12v9m-4.5-4.5h9" /></svg>
          </button>
          <button class="tools" id="colors" type="button" aria-label="Image colors" data-help="Add a color overlay to your images, adjust its opacity, or clear the tint.">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3" /><circle cx="8" cy="8" r="1.5" /><path d="m3 17 5-5 4 4 4-5 5 6" /></svg>
          </button>
          <button class="tools" id="eyedropper" type="button" aria-label="Arrange layout" aria-expanded="false" data-help="Turn Arrange on to drag pieces around the board. Adjust spacing, hide pieces, and restore hidden items here.">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18m-12-6 3-3 3 3m-6 12 3 3 3-3M6 9l-3 3 3 3m12-6 3 3-3 3" /></svg>
          </button>
          <button class="tools" id="boarders" type="button" aria-label="Borders" data-help="Change the border color, thickness, and corner rounding for your images or buttons.">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" /><path d="M8 8h8v8H8z" stroke-dasharray="2 3" /></svg>
          </button>
        </div>
        
        <div id="border-popout" class="border-popout" hidden>
          <div class="tool-panel-heading"><h3>Border Settings</h3><button class="tool-close" type="button" data-close-tool="border-popout" aria-label="Close border settings">×</button></div>
        
          <div class="border-control">
            <label for="border-target">Apply border to:</label>
            <select id="border-target">
              <option value="images">Images</option>
              <option value="buttons">Buttons</option>
            </select>
          </div>
        
          <label class="border-option">
            <input type="checkbox" id="border-enabled">
            Show border
          </label>
        
          <!-- Border color palette -->
          <div class="border-control">
            <label>Border color:</label>
        
            <div id="border-colors" class="border-colors">
        
              <button type="button"
                class="border-color active"
                data-color="#DDD8C4"
                style="--swatch-color: #DDD8C4"
                aria-label="Cream"
                aria-pressed="true">
              </button>
        
              <button type="button"
                class="border-color"
                data-color="#A3C9A8"
                style="--swatch-color: #A3C9A8"
                aria-label="Mint"
                aria-pressed="false">
              </button>
        
              <button type="button"
                class="border-color"
                data-color="#84B59F"
                style="--swatch-color: #84B59F"
                aria-label="Sage"
                aria-pressed="false">
              </button>
        
              <button type="button"
                class="border-color"
                data-color="#69A297"
                style="--swatch-color: #69A297"
                aria-label="Teal"
                aria-pressed="false">
              </button>
        
            </div>
          </div>
        
          <div class="border-control">
            <label for="border-radius">
              Corner rounding:
              <output id="border-radius-value">0px</output>
            </label>
        
            <input type="range"
              id="border-radius"
              min="0"
              max="100"
              value="0">
          </div>
        
          <div class="border-control">
            <label for="border-thickness">
              Border thickness:
              <output id="border-thickness-value">2px</output>
            </label>
        
            <input type="range"
              id="border-thickness"
              min="1"
              max="12"
              value="2">
          </div>

        </div>



        
        <!-- Color overlay popup -->
        <div id="color-popout" class="border-popout color-popout" hidden>
          <div class="tool-panel-heading"><h3>Image Color Settings</h3><button class="tool-close" type="button" data-close-tool="color-popout" aria-label="Close image color settings">×</button></div>
        
          <!-- Preset colors -->
          <div class="border-control">
            <label>Project colors:</label>
        
            <div id="overlay-colors" class="border-colors">
        
              <button type="button"
                class="overlay-color active"
                aria-label="Primary project color"
                aria-pressed="true">
              </button>
        
              <button type="button"
                class="overlay-color"
                aria-label="Secondary project color"
                aria-pressed="false">
              </button>
        
              <button type="button"
                class="overlay-color"
                aria-label="Accent project color"
                aria-pressed="false">
              </button>
        
              <button type="button"
                class="overlay-color"
                aria-label="Background project color"
                aria-pressed="false">
              </button>
        
            </div>
          </div>
        
          <!-- Custom color picker -->
          <div class="border-control">
            <label for="custom-overlay-color">
              Custom color:
            </label>
        
            <input
              type="color"
              id="custom-overlay-color"
              value="#DDD8C4">
          </div>
        
          <!-- Enable overlay -->
          <label class="border-option">
            <input type="checkbox" id="overlay-enabled">
            Show color overlay
          </label>
        
          <!-- Opacity slider -->
          <div class="border-control">
            <label for="overlay-opacity">
              Overlay opacity:
              <output id="overlay-opacity-value">30%</output>
            </label>
        
            <input
              type="range"
              id="overlay-opacity"
              min="0"
              max="100"
              value="30">
          </div>
        
          <!-- Remove overlay -->
          <button
            type="button"
            id="clear-overlay"
            class="overlay-clear">
            Remove overlay
          </button>
        </div>

        <!-- Draw-to-Style Popup -->
        <div id="draw-style-popout" class="draw-style-popout" hidden>
        
          <div class="draw-style-heading">
            <h3>Element Styling</h3>
            <button
              type="button"
              id="draw-style-close"
              aria-label="Close styling popup">
              ×
            </button>
          </div>
        
          <!-- Background color -->
          <div class="draw-style-section">
            <label>Background color</label>
        
            <div id="draw-background-colors" class="draw-style-colors">
              <!-- Generated from project palette -->
            </div>
        
            <label for="draw-background-custom">Custom background</label>
            <input
              type="color"
              id="draw-background-custom"
              value="#DDD8C4">
          </div>
        
          <hr>
        
          <!-- Text color -->
          <div class="draw-style-section">
            <label>Text color</label>
        
            <div id="draw-text-colors" class="draw-style-colors">
              <!-- Generated from project palette -->
            </div>
        
            <label for="draw-text-custom">Custom text color</label>
            <input
              type="color"
              id="draw-text-custom"
              value="#FFFFFF">
          </div>
        
        </div>
        
        <!-- Selection instruction -->
        <div id="draw-instruction" hidden>
          ✎ Select an element
        </div>
      
      

      </details>
      <section id="edit-utility">
        <div>
          <button id="undo" type="button" aria-label="Undo">‹</button>
          <button id="redo" type="button" aria-label="Redo">›</button>
        </div>
        <div>
          <a 
            class="finish-edit-btn"
            href="final.html"
            >FINISHED</a>
        </div>
      </section>
    </main>
    <script type="module" src="scripts/show-image.js"></script>
    <script type="module" src="scripts/generate-design.js"></script>
    <script type="module" src="scripts/palette-editor.js"></script>
    <script type="module" src="scripts/borders.js"></script>
    <script type="module" src="scripts/button-style.js"></script>
    <script type="module" src="scripts/project-name.js"></script>
    <script type="module" src="scripts/color-tool.js"></script>
    <script type="module" src="scripts/tool-close.js"></script>
    <script type="module" src="scripts/layout-tool.js"></script>
    <script type="module" src="scripts/shapes-tool.js"></script>
    <script type="module" src="scripts/change-color-tool.js"></script>
    <script type="module" src="scripts/tool-sidebar.js"></script>
    <script type="module" src="scripts/tool-help.js"></script>
    <footer></footer>
  </body>
</html>
