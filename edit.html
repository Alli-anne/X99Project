<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X99 Project</title>
    <link rel="stylesheet" href="Index.css">
  </head>
  <body class="design-page edit-page">
    <header id="main-header">
      <h1>Easy Design</h1>
    </header>
    <main class="design-workspace">
      <section id="edit-page">
        <h2 id="project-name" contenteditable="true" role="textbox" aria-label="Project name">Project Name</h2>
        <div class="color-palette" aria-label="Project color palette">
          <button class="palette-swatch palette-swatch--cream" type="button" data-color-role="primary" aria-label="Change primary color">DDD8C4</button>
          <button class="palette-swatch palette-swatch--mint" type="button" data-color-role="secondary" aria-label="Change secondary color">A3C9A8</button>
          <button class="palette-swatch palette-swatch--sage" type="button" data-color-role="accent" aria-label="Change accent color">84B59F</button>
          <button class="palette-swatch palette-swatch--teal" type="button" data-color-role="background" aria-label="Change background color">69A297</button>
          <button class="refresh-button" id="refresh-palette" type="button" aria-label="Try a different palette">⟳</button>
        </div>
        <p id="accessibility-warning" class="accessibility-warning" role="status" hidden></p>
        <div class="fonts-div">
          <div class="fonts">
            <h3>Header Font <button class="refresh-button" type="button" aria-label="Refresh header font">⟳</button></h3>
            <ul id="header-font">
              <li>Open Sauce</li>
              <li>Open Sauce</li>
              <li>Open Sauce</li>
              <li>Open Sauce</li>
              <li>Open Sauce</li>
            </ul>
          </div>
          <div class="fonts">
            <h3>Body Font <button class="refresh-button" type="button" aria-label="Refresh body font">⟳</button></h3>
            <ul id="body-font">
              <li>Arvo</li>
              <li>Arvo</li>
            </ul>
          </div>
        </div>
        <div class="button-div">
          <button class="btn">BUTTON</button>
          <button class="btn">BUTTON</button>
          <button class="btn">BUTTON</button>
          <button class="btn">BUTTON</button>
        </div>
        <div class="img-div">
          <div id="editing-selected-images"></div>
        </div>
      </section>
      <details id="edit-tools" open>
        <summary class="tools-toggle" aria-label="Toggle editing tools">✎</summary>
        <div class="tools-list" role="group" aria-label="Editing tools">
          <button class="tools" id="draw" type="button" aria-label="Draw">〰</button>
          <button class="tools" id="shapes" type="button" aria-label="Shapes"></button>
          <button class="tools" id="colors" type="button" aria-label="Colors"></button>
          <button class="tools" id="eyedropper" type="button" aria-label="Eyedropper"><svg viewBox="0 0 32 32" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m19 12-12 12-1 5 5-1 12-12M16 9l9 9M20 11l4-6a3 3 0 0 1 4 4l-6 4M5 29l-2 2"/></svg></button>
          <button class="tools" id="boarders" type="button" aria-label="Borders">◕</button>
        </div>
        
        <div id="border-popout" class="border-popout" hidden>
          <h3>Border Settings</h3>
        
          <div class="border-control">
            <label for="border-target">Apply border to:</label>
            <select id="border-target">
              <option value="images">Images</option>
              <option value="buttons">Buttons</option>
            </select>
          </div>
        
          <label class="border-option">
            <input type="checkbox" id="border-enabled">
            Show border
          </label>
        
          <!-- Border color palette -->
          <div class="border-control">
            <label>Border color:</label>
        
            <div id="border-colors" class="border-colors">
        
              <button type="button"
                class="border-color active"
                data-color="#DDD8C4"
                style="--swatch-color: #DDD8C4"
                aria-label="Cream"
                aria-pressed="true">
              </button>
        
              <button type="button"
                class="border-color"
                data-color="#A3C9A8"
                style="--swatch-color: #A3C9A8"
                aria-label="Mint"
                aria-pressed="false">
              </button>
        
              <button type="button"
                class="border-color"
                data-color="#84B59F"
                style="--swatch-color: #84B59F"
                aria-label="Sage"
                aria-pressed="false">
              </button>
        
              <button type="button"
                class="border-color"
                data-color="#69A297"
                style="--swatch-color: #69A297"
                aria-label="Teal"
                aria-pressed="false">
              </button>
        
            </div>
          </div>
        
          <div class="border-control">
            <label for="border-radius">
              Corner rounding:
              <output id="border-radius-value">0px</output>
            </label>
        
            <input type="range"
              id="border-radius"
              min="0"
              max="100"
              value="0">
          </div>
        
          <div class="border-control">
            <label for="border-thickness">
              Border thickness:
              <output id="border-thickness-value">2px</output>
            </label>
        
            <input type="range"
              id="border-thickness"
              min="1"
              max="12"
              value="2">
          </div>
        
        </div>


        
        <!-- Color overlay popup -->
        <div id="color-popout" class="border-popout color-popout" hidden>
          <h3>Image Color Settings</h3>
        
          <!-- Preset colors -->
          <div class="border-control">
            <label>Project colors:</label>
        
            <div id="overlay-colors" class="border-colors">
        
              <button type="button"
                class="overlay-color active"
                aria-label="Primary project color"
                aria-pressed="true">
              </button>
        
              <button type="button"
                class="overlay-color"
                aria-label="Secondary project color"
                aria-pressed="false">
              </button>
        
              <button type="button"
                class="overlay-color"
                aria-label="Accent project color"
                aria-pressed="false">
              </button>
        
              <button type="button"
                class="overlay-color"
                aria-label="Background project color"
                aria-pressed="false">
              </button>
        
            </div>
          </div>
        
          <!-- Custom color picker -->
          <div class="border-control">
            <label for="custom-overlay-color">
              Custom color:
            </label>
        
            <input
              type="color"
              id="custom-overlay-color"
              value="#DDD8C4">
          </div>
        
          <!-- Enable overlay -->
          <label class="border-option">
            <input type="checkbox" id="overlay-enabled">
            Show color overlay
          </label>
        
          <!-- Opacity slider -->
          <div class="border-control">
            <label for="overlay-opacity">
              Overlay opacity:
              <output id="overlay-opacity-value">30%</output>
            </label>
        
            <input
              type="range"
              id="overlay-opacity"
              min="0"
              max="100"
              value="30">
          </div>
        
          <!-- Remove overlay -->
          <button
            type="button"
            id="clear-overlay"
            class="overlay-clear">
            Remove overlay
          </button>
        
        </div>
        
      

      </details>
      <section id="edit-utility">
        <div>
          <button id="undo" type="button" aria-label="Undo">‹</button>
          <button id="redo" type="button" aria-label="Redo">›</button>
        </div>
        <div>
          <a 
            class="finish-edit-btn"
            href="final.html"
            >FINISHED</a>
        </div>
      </section>
    </main>
    <script type="module" src="scripts/show-image.js"></script>
    <script type="module" src="scripts/generate-design.js"></script>
    <script type="module" src="scripts/palette-editor.js"></script>
    <script type="module" src="scripts/borders.js"></script>
    <script type="module" src="scripts/project-name.js"></script>
    <script type="module" src="scripts/color-tool.js"></script>
    <footer></footer>
  </body>
</html>
