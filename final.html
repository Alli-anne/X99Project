<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X99 Project</title>
    <link rel="stylesheet" href="Index.css">
  </head>
  <body class="design-page final-page">
    <header id="main-header">
      <h1>Easy Design</h1>
    </header>
    <main class="design-workspace">
      <section id="final-page">
        <h2 id="project-name">Project Name</h2>
        <div class="color-palette" aria-label="Project color palette">
          <div class="palette-swatch palette-swatch--cream">DDD8C4</div>
          <div class="palette-swatch palette-swatch--mint">A3C9A8</div>
          <div class="palette-swatch palette-swatch--sage">84B59F</div>
          <div class="palette-swatch palette-swatch--teal">69A297</div>
        </div>
        <div class="fonts-div">
          <div class="fonts">
            <h3>Header Font</h3>
            <ul id="header-font">
              <li>Open Sauce</li>
              <li>Open Sauce</li>
              <li>Open Sauce</li>
              <li>Open Sauce</li>
              <li>Open Sauce</li>
            </ul>
          </div>
          <div class="fonts">
            <h3>Body Font</h3>
            <ul id="body-font">
              <li>Arvo</li>
              <li>Arvo</li>
              <li>Arvo</li>
              <li>Arvo</li>
              <li>Arvo</li>
            </ul>
          </div>
        </div>
        <div class="button-div">
          <button class="btn" type="button">BUTTON</button>
          <button class="btn" type="button">BUTTON</button>
        </div>
        <div class="img-div">
          <div id="editing-selected-images"></div>
        </div>
      </section>
      <section id="final-options">
        <div>
            <a class="finish-edit-btn" id="download-pdf" href="#" aria-label="Download this design as a PDF">
            <span class="final-action-icon" aria-hidden="true">⇩</span>
            <span>Download</span>
          </a>
          <a class="finish-edit-btn" id="share-project" href="#">
            <span class="final-action-icon" aria-hidden="true">↗</span>
            <span>Share</span>
          </a>
          <a class="finish-edit-btn" id="project-prompt" href="#">
            <span class="final-action-icon" aria-hidden="true">✦</span>
            <span>AI</span>
          </a>
        </div>
      </section>
    </main>
    <p id="final-status" role="status" aria-live="polite"></p>
    <dialog id="final-dialog" aria-labelledby="final-dialog-title">
      <header><h2 id="final-dialog-title"></h2><button type="button" id="close-final-dialog" aria-label="Close">×</button></header>
      <p id="final-dialog-help"></p>
      <label for="final-output" id="final-output-label">Project output</label>
      <textarea id="final-output" rows="14" spellcheck="false"></textarea>
      <div class="final-dialog-actions"><button type="button" id="copy-final-output">Copy</button><button type="button" id="save-final-output">Save prompt</button></div>
      <p id="final-dialog-status" role="status" aria-live="polite"></p>
    </dialog>
    <script type="module" src="scripts/final-page.js"></script>
  </body>
</html>
