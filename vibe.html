<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Index.css">
</head>
<body class="page vibe-page">
    <header class="site-header">
        <h2 class="site-header__brand">Easy Design</h2>
    </header>
    <main class="vibe-page__main"> 
        <div class="categories-header">
            <h2 class="categories-header__title">Categories</h2>
        </div>
        <div class="categories">
            <ul class="categories__list" aria-label="Choose an inspiration category">
                <li class="categories__item">
                    <label class="categories__button">
                        <input class="categories__input" type="radio" name="category" id="category-minimal" value="minimal">
                        <span>Minimal</span>
                    </label>
                </li>
                <li class="categories__item">
                    <label class="categories__button">
                        <input class="categories__input" type="radio" name="category" id="category-modern" value="modern" checked>
                        <span>Modern</span>
                    </label>
                </li>
                <li class="categories__item">
                    <label class="categories__button">
                        <input class="categories__input" type="radio" name="category" id="category-clean" value="clean">
                        <span>Clean</span>
                    </label>
                </li>
                <li class="categories__item">
                    <label class="categories__button">
                        <input class="categories__input" type="radio" name="category" id="category-bold" value="bold">
                        <span>Bold</span>
                    </label>
                </li>
                <li class="categories__item">
                    <label class="categories__button">
                        <input class="categories__input" type="radio" name="category" id="category-playful" value="playful">
                        <span>Playful</span>
                    </label>
                </li>
                <li class="categories__item">
                    <label class="categories__button">
                        <input class="categories__input" type="radio" name="category" id="category-elegant" value="elegant">
                        <span>Elegant</span>
                    </label>
                </li>
                <li class="categories__item">
                    <label class="categories__button">
                        <input class="categories__input" type="radio" name="category" id="category-professional" value="professional">
                        <span>Professional</span>
                    </label>
                </li>
                <li class="categories__item">
                    <label class="categories__button">
                        <input class="categories__input" type="radio" name="category" id="category-cozy" value="cozy">
                        <span>Cozy</span>
                    </label>
                </li>
                <li class="categories__item">
                    <label class="categories__button">
                        <input class="categories__input" type="radio" name="category" id="category-whimsical" value="whimsical">
                        <span>Whimsical</span>
                    </label>
                </li>
                <li class="categories__item">
                    <label class="categories__button">
                        <input class="categories__input" type="radio" name="category" id="category-futuristic" value="futuristic">
                        <span>Futuristic</span>
                    </label>
                </li>
                <li class="categories__item">
                    <label class="categories__button">
                        <input class="categories__input" type="radio" name="category" id="category-retro" value="retro">
                        <span>Retro</span>
                    </label>
                </li>
                <li class="categories__item">
                    <label class="categories__button">
                        <input class="categories__input" type="radio" name="category" id="category-vintage" value="vintage">
                        <span>Vintage</span>
                    </label>
                </li>
                <li class="categories__item">
                    <label class="categories__button">
                        <input class="categories__input" type="radio" name="category" id="category-organic" value="organic">
                        <span>Organic</span>
                    </label>
                </li>
                <li class="categories__item">
                    <label class="categories__button">
                        <input class="categories__input" type="radio" name="category" id="category-edgy" value="edgy">
                        <span>Edgy</span>
                    </label>
                </li>
                <li class="categories__item">
                    <label class="categories__button">
                        <input class="categories__input" type="radio" name="category" id="category-luxurious" value="luxurious">
                        <span>Luxurious</span>
                    </label>
                </li>
                <li class="categories__item">
                    <label class="categories__button">
                        <input class="categories__input" type="radio" name="category" id="category-geometric" value="geometric">
                        <span>Geometric</span>
                    </label>
                </li>
                <li class="categories__item">
                    <label class="categories__button">
                        <input class="categories__input" type="radio" name="category" id="category-soft" value="soft">
                        <span>Soft</span>
                    </label>
                </li>
                <li class="categories__item">
                    <label class="categories__button">
                        <input class="categories__input" type="radio" name="category" id="category-sharp" value="sharp">
                        <span>Sharp</span>
                    </label>
                </li>
            </ul>
        </div>
        <div class="color-picker">
            <h2 class="color-picker__title">Main Color</h2>
            <div class="color-box color-picker__swatch"></div>
            <h3 class="color-picker__value">#D6C5C7</h3>
            <input class="color-picker__input" id="main-color" type="color" value="#d6c5c7" aria-label="Choose main color">
            <button class="color-picker__button" type="button" aria-label="Choose main color"><svg viewBox="0 0 32 32" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m19 12-12 12-1 5 5-1 12-12M16 9l9 9M20 11l4-6a3 3 0 0 1 4 4l-6 4M5 29l-2 2"/></svg></button>
        </div>
        <!-- JavaScript fills this one gallery from scripts/category-images.js. -->
        <section class="style-preview" aria-labelledby="preview-title">
            <div class="style-preview__heading">
                <h2 class="style-preview__title" id="preview-title" aria-live="polite">Modern</h2>
            </div>
            <div class="style-preview__grid"></div>
            <noscript>Enable JavaScript to view the category image galleries.</noscript>
        </section>
        <a class="vibe-page__generate-button action-button" href="edit.html">Generate</a>
    </main>
    <script type="module" src="scripts/vibe.js"></script>
    <script type="module" src="scripts/select-image.js"></script>
    <script type="module" src="scripts/generate-design.js"></script>
    <script type="module" src="scripts/vibe-color.js"></script>
</body>
</html>
