<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Index.css">
</head>
<body class="page vibe-page">
    <header class="site-header">
        <h2 class="site-header__brand">Easy Design</h2>
    </header>
    <main class="vibe-page__main"> 
        <div class="categories-header">
            <h2 class="categories-header__title">Categories</h2>
        </div>
        <div class="categories">
            <ul class="categories__list">
                <li class="categories__item"><button class="categories__button">Minimal</button></li>
                <li class="categories__item"><button class="categories__button">Modern</button></li>
                <li class="categories__item"><button class="categories__button">Clean</button></li>
                <li class="categories__item"><button class="categories__button">Bold</button></li>
                <li class="categories__item"><button class="categories__button">Playful</button></li>
                <li class="categories__item"><button class="categories__button">Elegant</button></li>
                <li class="categories__item"><button class="categories__button">Professional</button></li>
                <li class="categories__item"><button class="categories__button">Cozy</button></li>
                <li class="categories__item"><button class="categories__button">Whimsical</button></li>
                <li class="categories__item"><button class="categories__button">futuristic</button></li>
                <li class="categories__item"><button class="categories__button">Retro</button></li>
                <li class="categories__item"><button class="categories__button">Vintage</button></li>
                <li class="categories__item"><button class="categories__button">Organic</button></li>
                <li class="categories__item"><button class="categories__button">Edgy</button></li>
                <li class="categories__item"><button class="categories__button">Luxurious</button></li>
                <li class="categories__item"><button class="categories__button">Geometric</button></li>
                <li class="categories__item"><button class="categories__button">Soft</button></li>
                <li class="categories__item"><button class="categories__button">Sharp</button></li>
            </ul>
        </div>
        <div class="color-picker">
            <h2 class="color-picker__title">Main Color</h2>
            <div class="color-box color-picker__swatch"></div>
            <h3 class="color-picker__value">#FFFFFF</h3>
            <button class="color-picker__button"><img class="color-picker__icon" src=""></button>
        </div>
        <div class="style-preview">
            <h2 class="style-preview__title">Modern</h2>
            <div class="style-preview__grid">
                <div class="style-preview__row">
                    <button class="style-preview__button"><img class="style-preview__image" src=""></button>
                    <button class="style-preview__button"><img class="style-preview__image" src=""></button>
                </div>
                <div class="style-preview__row">
                    <button class="style-preview__button"><img class="style-preview__image" src=""></button>
                    <button class="style-preview__button"><img class="style-preview__image" src=""></button>
                </div>
                <div class="style-preview__row">
                    <button class="style-preview__button"><img class="style-preview__image" src=""></button>
                    <button class="style-preview__button"><img class="style-preview__image" src=""></button>
                </div>
                <div class="style-preview__row">
                    <button class="style-preview__button"><img class="style-preview__image" src=""></button>
                    <button class="style-preview__button"><img class="style-preview__image" src=""></button>
                </div>
            </div>
        </div>
        <button class="vibe-page__generate-button">Generate</button>
    </main>
</body>
</html>
